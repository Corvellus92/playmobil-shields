name: Sync Animobil shield images
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 0'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch referenced public images
        run: python scripts/sync_animobil.py
      - name: Commit updated image data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animobil-images.json
          git diff --cached --quiet || (git commit -m "Sync Animobil shield image index" && git push)
