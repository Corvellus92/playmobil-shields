name: Import PlaymoDB Helmets
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_helmets.py'
      - '.github/workflows/import-helmets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse 23 PlaymoDB pages
        run: python scripts/import_helmets.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helmets-catalog.json
          git diff --cached --quiet || (git commit -m "Update PlaymoDB helmets catalog" && git push)
