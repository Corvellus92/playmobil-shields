<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161e28"><title>Saját gyűjtemény – Playmobil</title><style>*{box-sizing:border-box}body{margin:0;background:#10151b;color:#eef4fa;font:14px system-ui,Arial}a{color:#a9d9ff}header{position:sticky;top:0;z-index:2;background:#17212d;border-bottom:1px solid #34495e;padding:12px}h1{font-size:21px;margin:10px 0}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}button,input,select{font:inherit;background:#263646;color:#fff;border:1px solid #556b80;border-radius:9px;padding:9px;min-width:0}.bar input{flex:1;min-width:105px}button{cursor:pointer}main{max-width:980px;margin:auto;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{min-width:0;position:relative;background:#1c2935;border:2px solid #29c76a;border-radius:11px;padding:24px 5px 8px;min-height:172px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}.tile img{width:100%;height:100px;object-fit:contain}.placeholder{height:100px;display:grid;place-items:center;font-size:42px}.tile strong,.tile small{overflow-wrap:anywhere;max-width:100%}.tile strong{font-size:11px}.tile small{font-size:10px;color:#b1c3d2}.x{position:absolute;right:4px;top:4px;padding:0;width:23px;height:23px;color:white;background:#63323c;border:1px solid #a86f7b}.dialog{width:min(92vw,440px);max-height:90vh;overflow:auto;color:white;background:#1b2835;border:1px solid #6f8296;border-radius:12px}.dialog::backdrop{background:#000b}.dialog label{display:block;margin:10px 0 4px}.dialog input,.dialog select{width:100%}.dialog button{margin-top:12px}.hint{font-size:12px;color:#abc0d0}.count{color:#acd2b7;font-size:12px}.thumb{width:100%;max-height:130px;object-fit:contain}#warning{color:#ffcb84;font-size:12px}</style></head><body><header><a href="./">← Főoldal</a><h1>📦 Saját gyűjtemény</h1><div class="bar"><input id="search" type="search" placeholder="Keresés névre, cikkszámra…" aria-label="Keresés"><select id="categoryFilter"><option value="">Minden típus</option><option>Shields</option><option>Weapons</option><option>Helmets</option><option>Other</option></select></div><div class="bar"><button id="add">＋ Új tétel</button><button id="backup">Mentés képekkel (JSON)</button><button id="restore">Visszaállítás JSON</button><input id="restoreFile" type="file" accept=".json,application/json" hidden></div><div class="count" id="count"></div></header><main><div id="grid" class="grid"></div><p id="empty" class="hint"></p><p class="hint">Az adatok és a saját fényképek ezen az eszközön tárolódnak. A JSON-mentés a fényképeket is tartalmazza; másik eszközön ezzel tudod visszaállítani.</p></main><dialog id="editor" class="dialog"><h2 id="editorTitle">Új tétel</h2><label for="name">Megnevezés</label><input id="name" maxlength="120"><label for="part">Cikkszám (ha ismert)</label><input id="part" maxlength="100"><label for="category">Kategória</label><select id="category"><option>Shields</option><option>Weapons</option><option>Helmets</option><option>Other</option></select><label for="qty">Darabszám</label><input id="qty" type="number" min="1" max="99999" value="1"><label for="photo">Saját fénykép</label><input id="photo" type="file" accept="image/*"><img id="preview" class="thumb" hidden alt="Fénykép előnézet"><button id="removePhoto" type="button">Fénykép eltávolítása</button><label for="notes">Megjegyzés</label><input id="notes" maxlength="240" placeholder="Pl. állapot, szín, tárolási hely"><p id="warning"></p><button id="save">Mentés</button><button id="cancel">Mégse</button></dialog><script src="./inventory.js?v=19"></script></body></html>
